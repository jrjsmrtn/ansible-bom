name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "26 7 * * 1" # weekly, Mondays
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard cannot run on a private repository: it queries the GitHub GraphQL API, which the
    # default GITHUB_TOKEN cannot reach for private repos ("Resource not accessible by
    # integration"). The alternative is a personal access token — a long-lived secret added to
    # CI purely to grade a repository whose results cannot be published anyway while private.
    # Not worth the attack surface. This job activates by itself at the public-release gate.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF result
      id-token: write # publish results to the OSSF API
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires a PUBLIC repository. Once this job runs at all, the repo is
          # public — so publishing is both possible and the point of running it.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif

  govulncheck:
    name: Scheduled vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned line, not go.mod's floor — same reason as ci.yml. Reading the floor here would
      # make this scheduled scan report the floor toolchain's own stdlib advisories every Monday,
      # which is noise about a version nothing is built with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # CI on push only catches advisories disclosed while commits are happening. A quiet
      # branch can become vulnerable without anyone touching it, which is precisely the
      # failure this project exists to describe elsewhere.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
