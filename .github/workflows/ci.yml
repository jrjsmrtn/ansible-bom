name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Read-only by default; no job below needs more. Elevate per job if that ever changes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # Mirrors the local pre-commit gate (.lefthook.yml) so "works locally, fails in CI"
      # cannot happen through a difference in what is checked.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 5

  cataloger:
    name: syft cataloger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # A separate module (ADR-0008), so `go test ./...` at the root does not reach it.
      - name: Test
        working-directory: cataloger
        run: |
          gofmt -l . | tee /dev/stderr | (! grep -q .)
          go vet ./...
          go test ./...

      # The reason the cataloger is a separate module at all: the shipped binary must not
      # acquire syft's 445-module dependency graph. Assert it, so a stray import cannot
      # quietly undo the decision.
      - name: The CLI must not depend on syft
        run: |
          if go list -m all | grep -q anchore/syft; then
            echo "the root module now depends on syft — see ADR-0008"
            go list -m all | grep anchore
            exit 1
          fi
          echo "root module graph: $(go list -m all | wc -l) modules, no syft"

  bom:
    name: BOM conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Version-pinned, not hash-pinned. Full hash pinning needs a generated lockfile
      # (pip-compile --generate-hashes) covering platform-specific wheels; until that exists,
      # claiming --require-hashes here would be a control we do not actually have.
      - run: pip install jsonschema==4.26.0

      # The Go suite checks the BOM's structure and the claims it must carry, but not its
      # conformance to the CycloneDX specification. This closes that gap: emitting a document
      # that fails the published schema would make every consumer's ingestion our problem.
      - name: Emit and validate a CycloneDX BOM
        run: |
          go run ./cmd/ansible-bom scan content/testdata/tree > bom.json
          python3 scripts/validate-bom.py bom.json

  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # Hooks are local and bypassable with --no-verify; this is the enforcing copy.
      # The scheduled run in scorecard.yml catches advisories disclosed against branches
      # that are not seeing commits.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  dependency-review:
    name: Dependency review
    # Also unavailable on a private repository without GitHub Advanced Security — verified by
    # running it: "Dependency review is not supported on this repository." Like Scorecard, it
    # activates by itself at the public-release gate.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
