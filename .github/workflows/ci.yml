name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Read-only by default; no job below needs more. Elevate per job if that ever changes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A CURRENT toolchain, deliberately not go.mod's floor. The `go` directive states the
      # minimum a consumer needs; building with exactly that minimum means building against the
      # oldest, least patched standard library. govulncheck caught this: go1.23.0 carries
      # GO-2026-4602 and GO-2025-3750 in `os`, which this code calls constantly.
      #
      # The LINE is pinned rather than tracking `stable`, so a new Go major release cannot change
      # what CI builds without a commit here. Patch releases within 1.26 are still picked up,
      # which is what carries stdlib security fixes. Bump this deliberately when 1.27 lands —
      # Dependabot does not manage it, so it is a calendar item, roughly twice a year.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # Mirrors the local pre-commit gate (.lefthook.yml) so "works locally, fails in CI"
      # cannot happen through a difference in what is checked.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 5

  floor:
    name: Go floor compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exactly the version go.mod declares, which is the point: it proves the compatibility
      # claim is real rather than aspirational. Deliberately no govulncheck here — an old
      # toolchain has old stdlib advisories by definition, and that is a reason not to SHIP it,
      # not a reason to stop supporting it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - run: go build ./... && go test ./...

  cataloger:
    name: syft cataloger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cataloger's Go floor is syft's, not ours: syft requires a far newer toolchain than
      # the CLI does. Reading the root go.mod here would pick 1.23 and fail to build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cataloger/go.mod
          check-latest: false

      # A separate module (ADR-0008), so `go test ./...` at the root does not reach it.
      - name: Test
        working-directory: cataloger
        run: |
          gofmt -l . | tee /dev/stderr | (! grep -q .)
          go vet ./...
          go test ./...

      # The reason the cataloger is a separate module at all: the shipped binary must not
      # acquire syft's 445-module dependency graph. Assert it, so a stray import cannot
      # quietly undo the decision.
      - name: The CLI must not depend on syft
        run: |
          if go list -m all | grep -q anchore/syft; then
            echo "the root module now depends on syft — see ADR-0008"
            go list -m all | grep anchore
            exit 1
          fi
          echo "root module graph: $(go list -m all | wc -l) modules, no syft"

  bom:
    name: BOM conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Version-pinned, not hash-pinned. Full hash pinning needs a generated lockfile
      # (pip-compile --generate-hashes) covering platform-specific wheels; until that exists,
      # claiming --require-hashes here would be a control we do not actually have.
      - run: pip install jsonschema==4.26.0

      # The Go suite checks the BOM's structure and the claims it must carry, but not its
      # conformance to the CycloneDX specification. This closes that gap: emitting a document
      # that fails the published schema would make every consumer's ingestion our problem.
      - name: Emit and validate a CycloneDX BOM
        run: |
          go run ./cmd/ansible-bom scan content/testdata/tree > bom.json
          python3 scripts/validate-bom.py bom.json

  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # Hooks are local and bypassable with --no-verify; this is the enforcing copy.
      # The scheduled run in scorecard.yml catches advisories disclosed against branches
      # that are not seeing commits.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  dependency-review:
    name: Dependency review
    # The guard below keeps this off private repositories, where the action is unavailable
    # without GitHub Advanced Security — verified by running it there.
    #
    # It does NOT follow that going public is sufficient, and this comment used to say it was.
    # The repository is public (verified 2026-09-04) so the guard passes and the job runs — and
    # fails in about 4s with "Dependency review is not supported on this repository. Please
    # ensure that Dependency graph is enabled", pointing at /settings/security_analysis. Every
    # pull_request run has failed that way: 2026-08-06, 2026-08-13, 2026-09-03, 2026-09-04. Push
    # runs stay green only because the guard keeps the job off them.
    #
    # Scorecard is the contrast, not the precedent: it did activate by itself on going public and
    # has passed weekly since 2026-08-03. This one additionally needs the dependency graph turned
    # on by hand in repository settings — a switch, not a consequence. The REST endpoint
    # repos/{owner}/{repo}/dependency-graph/compare 404s, which is the same fact from the API
    # side. Until someone flips it, a red "Dependency review" is a settings gap and never a fault
    # in the diff under review.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
