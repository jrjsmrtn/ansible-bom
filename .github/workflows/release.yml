name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # Reproducibility, not paranoia: -trimpath removes absolute build paths, CGO_ENABLED=0
      # produces a static binary with no host libc dependency, and the version is injected from
      # the tag so a binary can never disagree with the release it came from.
      - name: Build
        env:
          CGO_ENABLED: "0"
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            name="ansible-bom_${TAG}_${os}_${arch}${ext}"
            echo "building $name"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/${name}" ./cmd/ansible-bom
          done
          ls -l dist/

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ansible-bom_* > SHA256SUMS
          cat SHA256SUMS

      # Base64 of the checksum file, which the SLSA generator consumes as its subject list.
      - id: hashes
        working-directory: dist
        run: echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the native binary
        run: |
          chmod +x "dist/ansible-bom_${{ steps.tag.outputs.tag }}_linux_amd64"
          "dist/ansible-bom_${{ steps.tag.outputs.tag }}_linux_amd64" version
          "dist/ansible-bom_${{ steps.tag.outputs.tag }}_linux_amd64" scan internal/content/testdata/tree > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 5

  sbom:
    name: SBOM
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tooling only — deliberately the workflow's own ref, not the tag being built. The
      # normaliser is build tooling rather than released source, and an older tag will not
      # contain it. The artefacts themselves come from the build job, which does check out
      # the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # A tool that emits bills of materials should ship one for itself — but of the right
      # subject. Scanning the repository directory catalogues the GitHub Actions workflow files
      # (16 pkg:github components) and misses the Go standard library entirely. Scanning the
      # built binary yields what a consumer actually needs: the linked module graph plus
      # `pkg:golang/stdlib@<version>`, which is what Go standard-library advisories match on.
      #
      # One SBOM per binary rather than a single representative. The module set is identical
      # across platforms, but "identical, trust me" is a caveat, and a consumer verifying the
      # artefact they downloaded should not have to reason about which SBOM applies to it.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Two deliberate choices here, both measured rather than assumed:
      #
      #   --select-catalogers go   PE binaries additionally trigger the pe-binary cataloger,
      #                            which adds an `application` component with version=UNKNOWN,
      #                            no purl, and 89 speculative CPEs permuted from the FILENAME.
      #                            That is fabricated identity data of exactly the kind that
      #                            produces false positives in CPE-matching scanners, and the
      #                            binary's real identity is already present as pkg:golang/...
      #                            Restricting to the go tag makes all platforms identical.
      #
      #   normalise-sbom.py        syft records the RESOLVED ABSOLUTE scan path in the `file`
      #                            component, and neither a relative argument nor --base-path
      #                            changes that for a file: scan (both tried). -trimpath removes
      #                            build paths from the binary; this does the same for the
      #                            document, so an SBOM does not depend on where it was built.
      - name: SBOM per binary
        working-directory: dist
        run: |
          for bin in ansible-bom_*; do
            case "$bin" in *SHA256SUMS*) continue ;; esac
            echo "cataloguing $bin"
            syft scan "file:${bin}" --select-catalogers go -o cyclonedx-json="${bin}.cdx.json" -q
          done
          python3 ../scripts/normalise-sbom.py ./*.cdx.json
          ls -l ./*.cdx.json

      # Fail loudly if the scan produced a BOM of the wrong thing. A supply-chain tool shipping
      # an SBOM that describes its own CI configuration would be a poor advertisement.
      - name: Assert the SBOMs describe Go modules
        run: |
          for sbom in dist/*.cdx.json; do
            python3 - "$sbom" <<'PY'
          import json, sys
          path = sys.argv[1]
          bom = json.load(open(path))
          purls = [c.get("purl", "") for c in bom.get("components", [])]
          golang = [p for p in purls if p.startswith("pkg:golang/")]
          if not golang:
              sys.exit(f"{path}: no pkg:golang components — wrong scan target")
          if not any(p.startswith("pkg:golang/stdlib@") for p in golang):
              sys.exit(f"{path}: no stdlib component — the binary was not catalogued")
          if any(p.startswith("pkg:github/") for p in purls):
              sys.exit(f"{path}: contains pkg:github components — CI config was catalogued")
          found = {p["value"] for c in bom.get("components", [])
                   for p in c.get("properties", []) if p.get("name") == "syft:package:foundBy"}
          if "pe-binary-package-cataloger" in found:
              sys.exit(f"{path}: PE cataloger ran — it adds an UNKNOWN-version component whose "
                       "CPEs are permuted from the filename")
          if "/home/runner" in open(path).read():
              sys.exit(f"{path}: embeds an absolute build path")
          print(f"{path}: {len(golang)} Go component(s), stdlib present, "
                "no PE component, no absolute paths")
          PY
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/*.cdx.json
          retention-days: 5

  # SLSA build provenance. The generator MUST be referenced by tag, not SHA: it verifies its own
  # release tag, and a SHA reference breaks that check. This is the single documented exception to
  # the SHA-pinning rule in ADR-0002 §6.
  #
  # Gated on the repository being public. Provenance is signed keylessly through Sigstore, which
  # records the repository name and workflow path in a PUBLIC transparency log — publishing that
  # for a repository deliberately kept private would leak exactly what privacy is protecting.
  provenance:
    name: SLSA provenance
    needs: [build]
    if: ${{ !github.event.repository.private }}
    permissions:
      actions: read # read the workflow path for the provenance subject
      id-token: write # mint the OIDC token used for keyless signing
      contents: write # attach provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  publish:
    name: Attach to release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
      id-token: write # keyless signing, when enabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist

      # Signing is gated for the same reason as provenance: keyless cosign publishes the
      # repository and workflow identity to a public transparency log.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !github.event.repository.private }}

      - name: Sign the checksum file
        if: ${{ !github.event.repository.private }}
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      # gh is preinstalled on the runner, so uploading needs no third-party action — one fewer
      # dependency in the path that publishes the artifacts.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # 0.x is published as a prerelease: the tool works, but its identifier contract is
          # explicitly unstable until the ansible purl type is registered (ADR-0004).
          prerelease=""
          case "$TAG" in v0.*) prerelease="--prerelease" ;; esac
          # The signed tag annotation is the authoritative description of the release, so the
          # notes come from it. `--notes-from-tag` cannot be combined with `--repo`, so the
          # annotation is read explicitly rather than relying on gh inferring the repository
          # from the working directory.
          ref_sha=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
          ref_type=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type')
          if [ "$ref_type" = "tag" ]; then
            gh api "repos/$REPO/git/tags/$ref_sha" --jq '.message' > notes.md
          else
            echo "Lightweight tag — no annotation to describe this release." > notes.md
          fi
          # --verify-tag refuses to invent a tag that does not already exist on the remote.
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
            --notes-file notes.md $prerelease

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
