# Quality gates for ansible-bom.
#
# Single stage — the checks are fast enough that a pre-push split would add ceremony without
# saving time. See ADR-0002 §6.
#
# Install with: lefthook install

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --verbose
    gofmt:
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          echo "gofmt needed for:"
          echo "$unformatted"
          exit 1
        fi
    vet:
      glob: "*.go"
      run: go vet ./...
    test:
      glob: "*.go"
      run: go test ./...

# A pull request merged on one forge lands only there. Once the merge arrives locally, push it
# onward so the other remote does not silently fall behind — `git pull` against a stale remote
# reports "Already up to date", which is true and misleading.
post-merge:
  commands:
    sync-remotes:
      run: scripts/sync-remotes.sh
